<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="calculator__header">
      <h1>Calculator</h1>
      <p>Simple, clear calculations</p>
    </header>

    <section class="calculator__display" aria-live="polite" aria-atomic="true">
      <div class="display__previous" id="previous-display"></div>
      <output class="display__current" id="current-display" aria-label="Current value">0</output>
    </section>

    <section class="calculator__keys" aria-label="Calculator keys">
      <button class="key key--utility" type="button" data-action="clear">AC</button>
      <button class="key key--utility" type="button" data-action="delete" aria-label="Delete last digit">DEL</button>
      <button class="key key--operator" type="button" data-operation="÷" aria-label="Divide">÷</button>
      <button class="key key--operator" type="button" data-operation="×" aria-label="Multiply">×</button>

      <button class="key" type="button" data-number="7">7</button>
      <button class="key" type="button" data-number="8">8</button>
      <button class="key" type="button" data-number="9">9</button>
      <button class="key key--operator" type="button" data-operation="−" aria-label="Subtract">−</button>

      <button class="key" type="button" data-number="4">4</button>
      <button class="key" type="button" data-number="5">5</button>
      <button class="key" type="button" data-number="6">6</button>
      <button class="key key--operator" type="button" data-operation="+" aria-label="Add">+</button>

      <button class="key" type="button" data-number="1">1</button>
      <button class="key" type="button" data-number="2">2</button>
      <button class="key" type="button" data-number="3">3</button>
      <button class="key key--equals" type="button" data-action="equals" aria-label="Equals">=</button>

      <button class="key key--zero" type="button" data-number="0">0</button>
      <button class="key" type="button" data-number=".">.</button>
    </section>
  </main>
</body>
</html>
